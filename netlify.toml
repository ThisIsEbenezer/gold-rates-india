[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# Optional knobs (override in Netlify UI -> Site settings -> Environment variables):
#   IMPORT_DUTY_PCT   default 15   (India effective customs duty on gold/silver since 13 May 2026)
#   LOCAL_PREMIUM_PCT default 0    (jeweller/bullion-dealer premium over landed cost)

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
