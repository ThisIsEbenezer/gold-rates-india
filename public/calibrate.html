<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Set today's shop rate</title>
<link rel="stylesheet" href="/styles.css">
<style>form{display:grid;gap:14px;max-width:420px}label{display:grid;gap:6px;font-weight:600;font-size:.9rem;color:var(--ink2)}
input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
button{font:inherit;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer}
#msg{min-height:1.5em;font-weight:600}.ok{color:var(--up)}.bad{color:var(--down)}</style></head>
<body><main class="wrap"><section class="panel" style="margin-top:30px">
<h1 style="font-family:var(--display);margin-bottom:6px">Set today's shop rate</h1>
<p class="muted" style="margin-top:0">Enter the rates your local shop shows. The site then matches them and follows the live market from there. Do this once a day, after the shop updates.</p>
<form id="f">
<label>24K gold, ₹ per gram<input name="gold24" inputmode="decimal" placeholder="12458" required></label>
<label>Silver, ₹ per gram (optional)<input name="silver" inputmode="decimal" placeholder="165"></label>
<label>PIN<input name="pin" type="password" autocomplete="current-password" required></label>
<button>Save rate</button><div id="msg" role="status"></div></form>
<p><a href="/">Back to the rates</a></p></section></main>
<script>
const f=document.getElementById('f'),m=document.getElementById('msg');
f.onsubmit=async e=>{e.preventDefault();m.className='';m.textContent='Saving…';
 const d=Object.fromEntries(new FormData(f));
 try{const r=await fetch('/api/calibrate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});const j=await r.json();
  if(r.ok){m.className='ok';m.textContent=`Saved. Gold premium ${j.calibration.goldPct}%`+(j.calibration.silverPct!=null?`, silver ${j.calibration.silverPct}%.`:'.');}
  else{m.className='bad';m.textContent=j.error||'Could not save.';}}catch{m.className='bad';m.textContent='Network error.';}};
</script></body></html>
