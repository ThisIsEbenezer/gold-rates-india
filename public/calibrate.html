<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Match shop prices · Sam’s Gold Prediction</title>
<link rel="stylesheet" href="/styles.css">
<style>
.cal{max-width:460px;margin:40px auto}
.cal label{display:block;font-weight:700;font-size:.88rem;color:var(--ink2);margin:16px 0 6px}
.cal input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.cal button{margin-top:22px;width:100%;font:inherit;font-weight:800;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#F2D480,#D9A63A);color:#2A1D00;cursor:pointer;transition:transform .15s}
.cal button:active{transform:scale(.98)}
.cal .msg{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:.9rem}
.cal .ok{background:#E3F6EE;color:#0A6B49}.cal .bad{background:#FDE9E7;color:#A12E27}
.cal small{color:var(--ink3)}
</style>
</head>
<body>
<main class="wrap"><section class="panel cal">
  <h1 style="font-size:1.3rem">Match shop prices</h1>
  <p class="muted">Enter today’s shop rate per gram. The site adjusts its premium so live rates match your shop, then keeps following the market.</p>
  <form id="f">
    <label for="pin">PIN</label><input id="pin" type="password" autocomplete="current-password" required>
    <label for="g24">Gold 24K, ₹ per gram</label><input id="g24" inputmode="decimal" placeholder="12458">
    <label for="s">Silver, ₹ per gram</label><input id="s" inputmode="decimal" placeholder="165">
    <button type="submit">Save and match</button>
  </form>
  <div id="out" role="status"></div>
  <p><small>Needs the <code>CALIBRATE_PIN</code> environment variable in Netlify. <a href="/">Back to rates</a></small></p>
</section></main>
<script>
const out = document.getElementById('out');
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault(); out.className = ''; out.textContent = 'Saving…';
  try {
    const r = await fetch('/api/calibrate', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pin: pin.value, g24: g24.value.replace(/,/g, ''), s: s.value.replace(/,/g, '') }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Failed');
    const c = j.calibration;
    out.className = 'msg ok';
    out.textContent = `Saved. Gold premium ${c.goldPct ?? '–'}%, silver premium ${c.silverPct ?? '–'}%. Rates update within a minute.`;
  } catch (err) { out.className = 'msg bad'; out.textContent = err.message; }
});
</script>
</body>
</html>
